<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura de controle if else</title>
</head>
<body>
    <script>
        let numero = 5;
        if(numero % 2 === 0) {
            document.write(numero + "é par <br>");
        }else {
            document.write(numero + "é par <br>");
        }

        for(let i = 1; i <= 5; i++){
            document.write("numero " + i + "<br>");
        }
    </script
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores!!!!</title>
</head>
<body>
    <script>
        let a = 10;
        let b = 5;

        document.write("Soma " + (a + b) + "<br>");
        document.write("Igual " + (a === b) + "<br>");

    </script>
</body>
</html>
